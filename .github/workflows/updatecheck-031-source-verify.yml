name: UpdateCheck 0.3.1 source SHA-256
on:
  push:
    paths:
      - '1FHD_UpdateCheck_0.3.1_Nexus-GitHub/**'
      - '.github/workflows/updatecheck-031-source-verify.yml'
  pull_request:
    paths:
      - '1FHD_UpdateCheck_0.3.1_Nexus-GitHub/**'
      - '.github/workflows/updatecheck-031-source-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 1FHD_UpdateCheck_0.3.1_Nexus-GitHub/verify_source.py
