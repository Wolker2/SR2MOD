name: Extract FHD FastCore 0.2.15 original sources
on:
  push:
    paths:
      - '.github/workflows/publish-fastcore-0215.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth=1 https://github.com/Xenomorphchyma/SRHD-XenoModKit.git /tmp/SRHD-XenoModKit
      - name: Publish original source, checksum and editable assets
        env:
          PYTHONPATH: /tmp/SRHD-XenoModKit:tools
        run: |
          python tools/nexus_source_export.py --archive '1FHD_FastCore_Error_0.2.15_Nexus-GitHub/install/FHD_FastCore_Error_0.2.15.zip' --target '1FHD_FastCore_Error_0.2.15_Nexus-GitHub' --sha256 d1aedcdbf89980c47c2bbfdc01342f6614cf6da59f8989a5554d51d20b4956ee --mod FHD_FastCore_Error
      - name: Commit checked sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '1FHD_FastCore_Error_0.2.15_Nexus-GitHub/SOURCE' '1FHD_FastCore_Error_0.2.15_Nexus-GitHub/VALIDATION_REPORT.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Extract verified FastCore 0.2.15 source from installation archive'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
